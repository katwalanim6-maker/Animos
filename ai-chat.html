<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Anim | Anim OS</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .ai-page{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#050505;color:#fff}
        .ai-card{width:min(760px,100%);padding:28px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.05);backdrop-filter:blur(18px);box-sizing:border-box}
        .ai-card h1{margin:0 0 8px}.ai-card p{opacity:.7;margin:0 0 20px}
        #chat-box{height:420px;overflow:auto;padding:12px;border-radius:16px;background:rgba(0,0,0,.35);margin-bottom:14px}
        .message{max-width:82%;padding:11px 14px;margin:9px 0;border-radius:14px;line-height:1.45;white-space:pre-wrap}
        .message.user{margin-left:auto;background:rgba(255,255,255,.12)}
        .message.ai{margin-right:auto;background:rgba(255,255,255,.07)}
        .chat-controls{display:flex;gap:10px}.chat-controls input{flex:1;min-width:0;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#0c0c0c;color:#fff}.chat-controls button{padding:13px 18px;border:0;border-radius:12px;cursor:pointer}.chat-controls button:disabled{opacity:.55;cursor:not-allowed}
    </style>
</head>
<body>
<div class="ai-page">
    <main class="ai-card">
        <h1>🤖 AI Anim</h1>
        <p>Ask me anything about Anim.</p>
        <div id="chat-box" aria-live="polite"></div>
        <div class="chat-controls">
            <input id="user-input" type="text" placeholder="Ask AI Anim..." autocomplete="off">
            <button id="send-btn" type="button">Send</button>
        </div>
    </main>
</div>
<script src="js/ai-chat.js"></script>
</body>
</html>
