<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users | Anim OS</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head><body><main class="admin-shell"><header class="admin-header"><h1>Users</h1><a class="admin-back" href="../admin.html">Admin home</a></header><section class="admin-card"><div id="status">Loading users…</div><div class="admin-table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Username</th><th>Role</th></tr></thead><tbody id="users"></tbody></table></div></section></main><script type="module">import {initAdmin,loadUsers} from '../js/admin.js';initAdmin({onReady:async()=>{const status=document.getElementById('status'),body=document.getElementById('users');try{const users=await loadUsers();body.innerHTML=users.map(u=>`<tr><td>${escapeHtml(u.name||u.displayName||'—')}</td><td>${escapeHtml(u.email||'—')}</td><td>${escapeHtml(u.username||'—')}</td><td>${escapeHtml(u.role||'user')}</td></tr>`).join('');status.textContent=`${users.length} user(s)`;}catch(e){status.textContent='Unable to load users. Check Firestore rules and indexes.';console.error(e);}}});function escapeHtml(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML;}</script></body></html>
