<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports | Anim OS</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head><body><main class="admin-shell"><header class="admin-header"><h1>Reports</h1><a class="admin-back" href="../admin.html">Admin home</a></header><section class="admin-card"><h2>System report</h2><dl class="report-list"><div><dt>Frontend</dt><dd>GitHub Pages</dd></div><div><dt>Authentication</dt><dd>Firebase Authentication</dd></div><div><dt>Database</dt><dd>Cloud Firestore</dd></div><div><dt>AI</dt><dd>Anim Core + Gemini</dd></div></dl><button id="health">Run health check</button><pre id="output">No check has been run.</pre></section></main><script type="module">import {initAdmin} from '../js/admin.js';initAdmin({onReady:()=>{document.getElementById('health').onclick=async()=>{const out=document.getElementById('output');out.textContent='Checking…';try{const r=await fetch('https://anim-core.onrender.com/health');out.textContent=JSON.stringify(await r.json(),null,2);}catch(e){out.textContent='AI backend unreachable: '+e.message;}};}});</script></body></html>
