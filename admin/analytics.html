<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics | Anim OS</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head><body><main class="admin-shell"><header class="admin-header"><h1>Analytics</h1><a class="admin-back" href="../admin.html">Admin home</a></header><section class="admin-grid"><article class="admin-stat"><span>Total users</span><strong id="users">—</strong></article><article class="admin-stat"><span>Total links</span><strong id="links">—</strong></article><article class="admin-stat"><span>AI endpoint</span><strong id="ai">Checking…</strong></article></section></main><script type="module">import {initAdmin,loadUsers,loadLinks} from '../js/admin.js';initAdmin({onReady:async()=>{try{const[u,l]=await Promise.all([loadUsers(),loadLinks()]);document.getElementById('users').textContent=u.length;document.getElementById('links').textContent=l.length;}catch(e){console.error(e)}try{const r=await fetch('https://anim-core.onrender.com/health');document.getElementById('ai').textContent=r.ok?'Online':'Offline';}catch{document.getElementById('ai').textContent='Offline';}}});</script></body></html>
