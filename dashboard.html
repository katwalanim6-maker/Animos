<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | Anim OS</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<div class="background"></div>

<div class="dashboard">

    <aside class="sidebar">

        <h2>Anim OS</h2>

        <button class="nav-btn active">🏠 Home</button>

        <a href="profile.html" class="nav-btn">👤 Profile</a>

        <button class="nav-btn">🔗 Links</button>

        <button class="nav-btn">📱 QR Code</button>

        <button class="nav-btn">📊 Analytics</button>

        <button class="nav-btn">⚙️ Settings</button>

        <button id="logoutBtn" class="nav-btn">
            🚪 Logout
        </button>

    </aside>

    <main class="content">

        <h1 id="welcomeText">
            Welcome back...
        </h1>

        <div class="profile-card">

            <img
                id="profilePic"
                src="assets/default-profile.png"
                alt="Profile Picture">

            <h2 id="username">
                Loading...
            </h2>

            <p id="email">
                Loading...
            </p>

            <input type="file" id="fileInput" accept="image/*" hidden>

<button id="uploadBtn">
    Upload Profile Picture
</button>

        </div>

        <div class="progress-card">

            <h2>📈 Profile Completion</h2>

            <div class="progress">
                <div class="progress-fill"></div>
            </div>

            <p class="check">✅ Name</p>
            <p class="check">✅ Email</p>
            <p class="check">❌ Username</p>
            <p class="check">❌ Bio</p>
            <p class="check">❌ Profile Picture</p>
            <p class="check">❌ Banner</p>

        </div>

    </main>

</div>

<script type="module" src="js/dashboard.js"></script>

</body>
</html>
