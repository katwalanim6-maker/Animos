<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Anim OS</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p>Welcome to Anim OS</p>

        <input
            type="text"
            id="name"
            placeholder="Full Name">

        <input
            type="email"
            id="email"
            placeholder="Email">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button id="signupBtn">
            Create Account
        </button>

        <p class="bottom-text">
            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>

<script type="module" src="js/signup.js"></script>

</body>
</html>
